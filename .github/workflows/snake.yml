name: Generate Snake

permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: parkkaviezhilarasan
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-pink.svg?color_snake=#FF4FA6&color_dots=transparent,transparent,#FF9ACB,#FF4FA6,#E91E8D,#9E1364

      - name: Publish
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
